[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptocoma"
version = "0.1.0"
description = "Computes the log-scale magnitudes of the Crypto Coma power tower (a…z, z^z)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Crypto Coma authors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "black>=24"]

[project.scripts]
cryptocoma = "cryptocoma.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
