project_name: "crypto-coma"
default_status: "To Do"
statuses: ["To Do", "In Progress", "Done"]
labels: []
definition_of_done: ["the site project is consistent", "every non-Latin locale passes the i18n completeness check (cd site && npm run build && npm run check:i18n) — no unfinished transcriptions"]
date_format: yyyy-mm-dd
max_column_width: 20
default_editor: "/opt/homebrew/bin/nano"
auto_open_browser: true
default_port: 6420
remote_operations: false
auto_commit: false
filesystem_only: false
zero_padded_ids: 3
bypass_git_hooks: false
check_active_branches: false
active_branch_days: 30
task_prefix: "task"
