project_name: "crypto-coma"
default_status: "To Do"
statuses: ["To Do", "In Progress", "Done"]
labels: []
definition_of_done: ["Ran QA gate: npm run check:i18n passes", "Ran QA gate: npx astro check passes", "Ran QA gate: npm run build succeeds", "No math/symbols/numbers/sources/citations or the term crypto coma / ℂ⇈ were altered", "Meaning and register preserved against the RU/EN source"]
date_format: yyyy-mm-dd
max_column_width: 20
default_editor: "/opt/homebrew/bin/nano"
auto_open_browser: true
default_port: 6420
remote_operations: false
auto_commit: false
filesystem_only: false
zero_padded_ids: 3
bypass_git_hooks: false
check_active_branches: false
active_branch_days: 30
task_prefix: "task"
