<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img"
     aria-label="Two boys on a bench under a starry sky (placeholder sketch)">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12122b"/>
      <stop offset="0.6" stop-color="#2c2c46"/>
      <stop offset="0.78" stop-color="#8a8574"/>
      <stop offset="1" stop-color="#cfc9b8"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" fill="#f4f1e8"/>
  <rect width="640" height="480" fill="url(#sky2)"/>

  <!-- stars -->
  <g fill="#f7f5ef">
    <circle cx="40" cy="36" r="2.6"/><circle cx="110" cy="70" r="1.5"/><circle cx="180" cy="30" r="2"/>
    <circle cx="250" cy="80" r="1.4"/><circle cx="320" cy="40" r="3"/><circle cx="390" cy="74" r="1.6"/>
    <circle cx="460" cy="34" r="2.3"/><circle cx="530" cy="82" r="1.5"/><circle cx="600" cy="44" r="2.7"/>
    <circle cx="70" cy="130" r="1.7"/><circle cx="150" cy="150" r="1.3"/><circle cx="230" cy="128" r="2.1"/>
    <circle cx="300" cy="160" r="1.4"/><circle cx="380" cy="132" r="1.8"/><circle cx="470" cy="150" r="1.5"/>
    <circle cx="560" cy="126" r="2"/><circle cx="610" cy="168" r="1.4"/><circle cx="30" cy="200" r="1.5"/>
    <circle cx="120" cy="210" r="1.3"/><circle cx="210" cy="196" r="1.5"/><circle cx="410" cy="205" r="1.3"/>
    <circle cx="500" cy="212" r="1.5"/><circle cx="590" cy="198" r="1.4"/>
  </g>

  <!-- ground -->
  <rect y="360" width="640" height="120" fill="#c7c1b0"/>
  <g stroke="#1a1a2e" stroke-width="1" opacity="0.25">
    <path d="M60 430 l8 -16"/><path d="M120 436 l8 -16"/><path d="M200 430 l8 -16"/>
    <path d="M470 434 l8 -16"/><path d="M540 430 l8 -16"/><path d="M600 436 l8 -16"/>
  </g>

  <!-- bench -->
  <g fill="#1a1a2e">
    <rect x="150" y="360" width="330" height="12" rx="2"/>
    <rect x="168" y="372" width="10" height="70"/>
    <rect x="452" y="372" width="10" height="70"/>
  </g>

  <!-- two seated boys (simple ink silhouettes, looking up) -->
  <g fill="#1a1a2e">
    <!-- left boy -->
    <circle cx="258" cy="286" r="17"/>
    <path d="M240 360 q-4 -50 18 -66 q22 16 18 66 z"/>
    <path d="M258 360 q28 4 40 26" stroke="#1a1a2e" stroke-width="9" fill="none" stroke-linecap="round"/>
    <!-- right boy -->
    <circle cx="386" cy="288" r="17"/>
    <path d="M368 360 q-4 -48 18 -64 q22 16 18 64 z"/>
    <path d="M386 360 q-26 6 -38 28" stroke="#1a1a2e" stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>

  <text x="20" y="466" font-family="system-ui, sans-serif" font-size="12" fill="#1a1a2e" opacity="0.7">
    Двое мальчиков считают звёзды · Two boys counting stars
  </text>
  <text x="620" y="466" text-anchor="end" font-family="system-ui, sans-serif" font-size="11"
        fill="#1a1a2e" opacity="0.45">placeholder sketch</text>
</svg>
