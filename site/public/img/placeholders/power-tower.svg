<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img"
     aria-label="Ascent to the crypto coma: a to b to ... to the crypto coma">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12122b"/>
      <stop offset="0.62" stop-color="#33334f"/>
      <stop offset="1" stop-color="#f4f1e8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="460" fill="#f4f1e8"/>
  <rect width="800" height="460" fill="url(#sky)"/>

  <!-- starfield -->
  <g fill="#f7f5ef">
    <circle cx="40" cy="40" r="2.4"/><circle cx="120" cy="70" r="1.6"/>
    <circle cx="200" cy="34" r="3"/><circle cx="270" cy="90" r="1.4"/>
    <circle cx="330" cy="50" r="2"/><circle cx="410" cy="30" r="2.6"/>
    <circle cx="480" cy="78" r="1.5"/><circle cx="540" cy="44" r="2.2"/>
    <circle cx="610" cy="96" r="1.7"/><circle cx="680" cy="40" r="3.1"/>
    <circle cx="740" cy="82" r="1.9"/><circle cx="90" cy="130" r="1.8"/>
    <circle cx="170" cy="160" r="1.3"/><circle cx="250" cy="140" r="2.3"/>
    <circle cx="360" cy="120" r="1.5"/><circle cx="450" cy="150" r="2"/>
    <circle cx="560" cy="128" r="1.4"/><circle cx="640" cy="164" r="1.9"/>
    <circle cx="720" cy="140" r="1.5"/><circle cx="30" cy="200" r="1.6"/>
    <circle cx="300" cy="196" r="1.3"/><circle cx="500" cy="205" r="1.5"/>
    <circle cx="770" cy="210" r="1.4"/>
  </g>

  <!-- ascending ladder a -> ... -> crypto coma -->
  <g stroke="#f7f5ef" stroke-width="1.4" stroke-dasharray="3 5" opacity="0.7" fill="none">
    <path d="M90 384 L180 344 L270 306 L350 268 L430 230 L512 190 L592 146 L694 96"/>
  </g>
  <g font-family="Georgia, serif" fill="#f7f5ef" text-anchor="middle">
    <circle cx="90"  cy="384" r="5"  fill="#f7f5ef"/><text x="90"  y="406" font-size="15">a</text>
    <circle cx="180" cy="344" r="6"  fill="#f7f5ef"/><text x="180" y="366" font-size="15">b</text>
    <circle cx="270" cy="306" r="7"  fill="#f7f5ef"/><text x="270" y="330" font-size="15">c</text>
    <circle cx="350" cy="268" r="8"  fill="#f7f5ef"/><text x="350" y="252" font-size="15">d</text>
    <circle cx="430" cy="230" r="9"  fill="#f7f5ef"/><text x="430" y="214" font-size="15">e</text>
    <text x="512" y="196" font-size="18">…</text>
    <circle cx="592" cy="146" r="11" fill="#f7f5ef"/><text x="592" y="128" font-size="15">z</text>
    <circle cx="694" cy="96"  r="15" fill="#fff"/>
    <text x="694" y="72" font-size="20" font-weight="bold" fill="#fff">ℂ⇈</text>
  </g>

  <!-- ground line -->
  <path d="M0 420 H800" stroke="#1a1a2e" stroke-width="1" opacity="0.3"/>

  <text x="24" y="446" font-family="system-ui, sans-serif" font-size="12" fill="#1a1a2e" opacity="0.7">
    Восхождение к крипто коме — a → b → … → ℂ⇈
  </text>
  <text x="776" y="446" text-anchor="end" font-family="system-ui, sans-serif" font-size="11"
        fill="#1a1a2e" opacity="0.45">placeholder · replace with cross-hatch art</text>
</svg>
